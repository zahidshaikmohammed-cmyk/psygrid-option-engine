[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psygrid-option-engine"
version = "0.1.0"
description = "Intraday intelligence and option-trading decision engine for NIFTY/BANKNIFTY, consuming the PSYGRID live-data API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dateutil>=2.9",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.4",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
psygrid-option-engine = "psygrid_option_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["psygrid_option_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
